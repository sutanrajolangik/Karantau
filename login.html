<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Creator Studio — Karantau</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        .font-sans-custom { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        html { scroll-behavior: smooth; }
        ::selection { background-color: #d97706; color: white; }
    </style>
</head>
<body class="bg-[#07090e] text-slate-100 font-sans-custom antialiased min-h-screen flex flex-col justify-between selection:bg-amber-600 selection:text-white">

    <!-- NAVBAR SEDERHANA -->
    <header class="bg-[#07090e]/80 backdrop-blur-2xl border-b border-amber-500/10">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="font-cinzel text-xl md:text-2xl font-bold tracking-[0.2em] bg-gradient-to-r from-amber-200 via-amber-400 to-indigo-300 bg-clip-text text-transparent">
                KARANTAU
            </a>
            <a href="index.html" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 hover:border-amber-400 text-xs font-semibold text-slate-300 transition">
                &larr; Beranda Utama
            </a>
        </div>
    </header>

    <!-- KONTEN UTAMA LOGIN -->
    <main class="max-w-md mx-auto px-6 py-12 flex-grow flex items-center justify-center w-full">
        <div class="bg-gradient-to-br from-slate-900 via-indigo-950 to-[#0b0e14] border border-amber-500/30 p-8 md:p-10 rounded-3xl shadow-2xl w-full space-y-8 relative overflow-hidden">
            
            <div class="absolute -right-16 -top-16 w-48 h-48 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <div class="text-center space-y-2 relative z-10">
                <span class="text-[10px] font-bold text-amber-400 uppercase tracking-[0.3em]">Otorisasi Kreator</span>
                <h1 class="text-2xl md:text-3xl font-bold font-cinzel text-amber-100">Creator Studio</h1>
                <p class="text-xs text-slate-400">Masukkan kredensial rahasia untuk mengakses panel kendali.</p>
            </div>

            <!-- FORM LOGIN -->
            <form onsubmit="handleLogin(event)" class="space-y-5 relative z-10">
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Username Admin</label>
                    <input type="text" id="username" placeholder="Contoh: rangga" required class="w-full bg-[#07090e] border border-slate-800 rounded-2xl p-3.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Password Rahasia</label>
                    <input type="password" id="password" placeholder="••••••••" required class="w-full bg-[#07090e] border border-slate-800 rounded-2xl p-3.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
                </div>

                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 text-slate-950 font-bold text-xs uppercase tracking-wider rounded-2xl shadow-xl shadow-amber-500/10 transition cursor-pointer">
                    Masuk ke Studio &rarr;
                </button>
            </form>

            <div class="text-center pt-2 border-t border-slate-800/80 text-[11px] text-slate-500">
                <p>Default Username: <span class="text-amber-400 font-semibold">rangga</span> | Password: <span class="text-amber-400 font-semibold">karantau2026</span></p>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-900 py-8 text-center text-xs text-slate-500">
        <p class="font-cinzel tracking-widest font-semibold text-amber-400/80">AETHELGARD CREATOR STUDIO</p>
        <p class="mt-1">&copy; 2026 Hak Cipta Dilindungi.</p>
    </footer>

    <!-- SCRIPT LOGIN -->
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            // Anda bisa mengganti username dan password di sini sesuai keinginan
            if (user === 'rangga' && pass === 'karantau2026') {
                // Simpan status login di sessionStorage browser
                sessionStorage.setItem('karantau_logged_in', 'true');
                alert("Login Berhasil! Selamat datang kembali, Rangga.");
                window.location.href = 'admin.html';
            } else {
                alert("Username atau Password salah! Silakan coba lagi.");
            }
        }
    </script>
</body>
</html>
